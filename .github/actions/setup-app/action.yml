name: Setup app
description: >
  Installe Python avec le cache pip natif de setup-python, puis installe les
  dependances du projet. Utilisee par les jobs lint, lint-yaml et test pour
  eviter de dupliquer ce bloc dans chaque workflow.

inputs:
  python-version:
    description: Version de Python a installer
    required: false
    default: "3.12"
  requirements:
    description: Fichier de dependances a installer
    required: false
    default: requirements-dev.txt

runs:
  using: composite
  steps:
    - name: Installer Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Installer les dependances
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r "${{ inputs.requirements }}"

    - name: Afficher l'environnement
      shell: bash
      run: |
        python --version
        pip --version
